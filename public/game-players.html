<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Players - Monopoly Companion</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="container">
      <h1>Players & Properties</h1>
      <p><a href="/game.html">Back to Game Hub</a></p>

      <section class="create-game">
        <h2>Create Game</h2>
        <label>Players count: <input id="player-count" type="number" value="2" min="2" max="8"></label>
        <label>Property set: <select id="property-file-select"></select></label>
        <label>Starting cash: <input id="starting-cash" type="number" value="1500" min="0"></label>
        <div id="player-names"></div>
        <button id="create-game">Create Game</button>
        <button id="create-rolloff">Create + Roll-off</button>
        <button id="load-game">Load Game</button>

        <div id="rolloff-area" style="margin-top:10px; display:none">
          <h3>Roll-off to decide first player</h3>
          <button id="start-rolloff">Start Roll-off</button>
          <div id="rolloff-results"></div>
        </div>
      </section>

      <section class="players">
        <h2>Players</h2>
        <div id="players-area"></div>
        <button id="end-turn">End Turn</button>
      </section>

      <section id="dice-area" style="display:none; margin-top:12px">
        <h3>Beginning Player: Roll Dice</h3>
        <label>Count: <input id="dice-count" type="number" value="2" min="1" max="10"></label>
        <label>Sides: <input id="dice-sides" type="number" value="6" min="2" max="100"></label>
        <button id="roll-btn">Roll</button>
        <div id="roll-result"></div>
        <h4>Or enter the roll manually</h4>
        <input id="manual-rolls" placeholder="Enter rolls comma-separated, e.g. 3,4" />
        <input id="manual-note" placeholder="Optional note" />
        <button id="log-manual">Log Manual Roll</button>
      </section>

      <section id="management-area" style="display:none; margin-top:12px">
        <h2>Management</h2>
        <p>After the first move, manage properties and money below.</p>
        <section id="properties-list-area"></section>
      </section>

    </div>
    <script src="/game.js"></script>
  </body>
</html>
