<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Property Editor - Monopoly Companion</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="container">
      <h1>Property Editor</h1>
      <p><a href="/">Back to Home</a></p>
      <section class="properties">
        <h2>Property Cards (editable)</h2>
        <label>Choose config: <select id="config-select"></select></label>
        <label>Title: <input id="config-title" placeholder="Config title (metadata)" /></label>
        <div style="margin:8px 0">
          <button id="new-config">New</button>
          <button id="load-config">Load</button>
          <button id="save-config">Save</button>
          <button id="save-as-config">Save As...</button>
        </div>
        <div id="properties-area"></div>
      </section>
    </div>
    <script src="/editor.js"></script>
  </body>
</html>
