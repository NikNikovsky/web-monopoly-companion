<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dice - Monopoly Companion</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="container">
      <h1>Dice & Roll History</h1>
      <p><a href="/game.html">Back to Game Hub</a></p>

      <section class="dice">
        <h2>Dice</h2>
        <label>Count: <input id="dice-count" type="number" value="2" min="1" max="10"></label>
        <label>Sides: <input id="dice-sides" type="number" value="6" min="2" max="100"></label>
        <button id="roll-btn">Roll</button>
        <div id="roll-result"></div>

        <h3>Manual entry</h3>
        <input id="manual-rolls" placeholder="Enter rolls comma-separated, e.g. 3,4" />
        <input id="manual-note" placeholder="Optional note" />
        <button id="log-manual">Log Manual Roll</button>
      </section>

      <section class="history">
        <h2>Roll History</h2>
        <ul id="roll-history"></ul>
      </section>

    </div>
    <script src="/game.js"></script>
  </body>
</html>
